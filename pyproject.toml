[project]
name = "jev-retrieval-ladder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "bm25s>=0.3.11",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.3",
    "ranx>=0.3.21",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ladder"]
